services:
  postgres:
    image: postgres:17-alpine
    container_name: dab-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ../:/workspace:ro
      - dab-pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: dab-mongo
    ports:
      - "27017:27017"
    volumes:
      - ../:/workspace:ro
      - dab-mongodata:/data/db
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ping:1}).ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dab-pgdata:
  dab-mongodata:
